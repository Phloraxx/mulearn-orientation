services:
  orientation:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - orientation-data:/data
      - ./content:/content:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3

volumes:
  orientation-data:
